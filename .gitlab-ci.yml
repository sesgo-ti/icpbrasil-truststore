stages:
  - build
  - deploy

# Variáveis globais
variables:
  HARBOR_REGISTRY: harbor.saude-go.net
  HARBOR_PROJECT: bigdata
  IMAGE_NAME: $HARBOR_REGISTRY/$HARBOR_PROJECT/icp-brasil-trust-store
  HARBOR_USERNAME: $CI_REGISTRY_USER
  HARBOR_PASSWORD: $CI_REGISTRY_PASSWORD
  TRUSTSTORE_FILE: mytruststore.jks

#-------------------------------------------
# Etapa 1 - Build e Push da Imagem
#-------------------------------------------
build-push:
  image: docker:20.10.16
  stage: build
  services:
    - name: docker:20.10.16-dind
  before_script:
    - echo "Login no Harbor..."
    - echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" -u "$HARBOR_USERNAME" --password-stdin
  script:
    - docker build -t $IMAGE_NAME:$CI_PIPELINE_ID -t $IMAGE_NAME:latest .
    - docker push $IMAGE_NAME:$CI_PIPELINE_ID
    - docker push $IMAGE_NAME:latest
  after_script:
    - docker logout $HARBOR_REGISTRY
  tags:
    - fhir

#-------------------------------------------
# Etapa 2 - Deploy (execução via docker-compose.prod.yml)
#-------------------------------------------
deploy-prod:
  image: alpine:3.20
  stage: deploy
  before_script:
    - apk add --no-cache openssh-client docker-cli docker-compose
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
    - echo "$MYTRUSTSTORE_BASE64" | base64 -d > mytruststore.jks

  script:
    - echo "Copiando arquivos para $DEPLOY_USER@$DEPLOY_HOST..."
    - scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no docker-compose.prod.yml mytruststore.jks $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/

    - echo "Executando deploy remoto..."
    - |
      ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
      echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" -u "$HARBOR_USERNAME" --password-stdin
      cd $DEPLOY_PATH
      docker compose -f docker-compose.prod.yml pull
      docker compose -f docker-compose.prod.yml up -d --remove-orphans
      docker image prune -af || true
      EOF

  after_script:
    - rm -f mytruststore.jks
  tags:
    - fhir
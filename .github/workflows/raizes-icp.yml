name: Alerta de raízes ICP-Brasil e TLS do ITI

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    name: Acervo e TLS reais
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Download real com as âncoras ISRG e comparação das raízes com RaizesFixadas.
      - name: Testes de integração
        run: >-
          ./mvnw -B -ntp -pl icpbrasil-truststore-core -am verify -Pintegration-tests
          -Dtest='DownloaderTest,RaizesFixadasIntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Abrir issue de alerta
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          corpo=icpbrasil-truststore-core/target/alerta-icp.md
          if [[ -f "$corpo" ]]; then
            base="$corpo"
          else
            # Sem relatório (ex.: falha de TLS no download): o título deriva de um texto fixo,
            # porque o corpo traz a URL da execução e mudaria a cada dia.
            base=$(mktemp)
            printf 'Falha no download real do ITI com as âncoras fixadas (troca de CA ou de hierarquia).\n' > "$base"
            mkdir -p "$(dirname "$corpo")"
            { cat "$base"; printf '\nExecução: %s/%s/actions/runs/%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"; } > "$corpo"
          fi
          titulo="Alerta ICP-Brasil/TLS: $(sha256sum "$base" | cut -c1-12)"
          existente=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --search "\"$titulo\" in:title" --json number,title \
            -q "map(select(.title == \"$titulo\")) | .[0].number // empty")
          if [[ -n "$existente" ]]; then
            echo "Issue já aberta (#$existente): $titulo"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$titulo" --body-file "$corpo"
          fi

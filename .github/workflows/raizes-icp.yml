name: Alerta de raízes ICP-Brasil e TLS do ITI

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    name: Acervo e TLS reais
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Download real com as âncoras ISRG e comparação das raízes com RaizesFixadas.
      - name: Testes de integração
        run: >-
          ./mvnw -B -ntp -pl icpbrasil-truststore-core -am verify -Pintegration-tests
          -Dtest='DownloaderTest,RaizesFixadasIntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false

      # Falha em qualquer passo anterior abre a issue de alerta, ou comenta nela se já estiver aberta.
      - name: Abrir issue de alerta
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/abrir-alerta-icp.sh

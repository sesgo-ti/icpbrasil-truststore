name: Alerta de raízes ICP-Brasil e TLS do ITI

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    name: Acervo e TLS reais
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Download real com as âncoras ISRG e comparação das raízes com RaizesFixadas.
      - name: Testes de integração
        run: >-
          ./mvnw -B -ntp -pl icpbrasil-truststore-core -am verify -Pintegration-tests
          -Dtest='DownloaderTest,RaizesFixadasIntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false

      # Falha em qualquer passo anterior abre a issue de alerta, ou comenta nela se já estiver aberta.
      - name: Abrir issue de alerta
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/abrir-alerta-icp.sh

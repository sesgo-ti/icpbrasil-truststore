name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # -Prelease gera os sources/Javadoc exigidos pelo Central; -Dgpg.skip dispensa chave no CI.
      - name: Build e testes
        run: ./mvnw -B --no-transfer-progress verify -Prelease -Dgpg.skip=true

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

      - name: Publicar relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/
            **/target/site/jacoco-aggregate/
          retention-days: 7

  reprodutibilidade:
    name: Build reproduzível
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Dois builds limpos dos artefatos não assinados (JARs, sources e Javadoc de todos os
      # módulos, inclusive o executável REST) precisam ter o mesmo SHA-256.
      - name: Comparar dois builds limpos
        run: |
          set -euo pipefail
          construir() {
            ./mvnw -B -ntp -q clean package -DskipTests -Prelease -Dgpg.skip=true
            find . -path '*/target/*' \( -name '*.jar' -o -name '*.pom' \) -not -path '*/target/*/*' \
              | sort | xargs sha256sum > "$1"
          }
          construir "$RUNNER_TEMP/primeiro.sha256"
          construir "$RUNNER_TEMP/segundo.sha256"
          cat "$RUNNER_TEMP/primeiro.sha256"
          diff -u "$RUNNER_TEMP/primeiro.sha256" "$RUNNER_TEMP/segundo.sha256"

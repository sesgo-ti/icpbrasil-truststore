version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    # Major do Spring Boot exige migração de código e revisão dos overrides do pom raiz;
    # é planejada à parte, não aplicada como bump.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    # setup-java >= 6.3.0 grava repositórios no settings.xml e o build deixa de
    # resolver central-publishing-maven-plugin:0.11.0 (PR #61, run 44059872455).
    ignore:
      - dependency-name: "actions/setup-java"
        versions: [">= 6.3.0"]

spring:
  application:
    name: trust-store-icpbrasil

# Configurações do TrustStore ICP-Brasil
truststore-icpbrasil:
  # URLs Oficiais da ICP-Brasil para download dos certificados e hash
  # [Resultado]: Define de onde o sistema baixa as atualizações
  certificate-url: "https://acraiz.icpbrasil.gov.br/credenciadas/CertificadosAC-ICP-Brasil/ACcompactado.zip"
  hash-url: "https://acraiz.icpbrasil.gov.br/credenciadas/CertificadosAC-ICP-Brasil/hashsha512.txt"

  # Configurações de Rede e Resiliência
  # [Resultado]: Controla o comportamento em caso de falha na conexão
  network:
    download-timeout-seconds: 60  # Tempo máximo de espera pelo download (30-300s)
    max-retries: 3                # Número de tentativas em caso de erro (1-10)
    retry-interval-seconds: 30    # Tempo entre tentativas (10-300s)

  # Ciclo de Vida do Cache e Alertas
  # [Resultado]: Controla quando o cache é considerado inválido ou crítico
  refresh-interval-hours: 2       # Frequência de verificação de novas atualizações (Horas)
  cache-ttl-critical-hours: 72    # Tempo sem atualização para entrar em estado CRÍTICO (Horas)
  cache-ttl-max-hours: 168        # Tempo máximo de vida do cache antes de expirar (Horas)

  # Ativação de Componentes Opcionais
  # [Resultado]: Permite desligar partes do sistema se usado apenas como biblioteca
  rest:
    enabled: false                 # Expõe o endpoint /certificate para consulta externa
  scheduling:
    enabled: true                 # Ativa a rotina automática (Cron) de atualização em background

  # Estratégia de Armazenamento
  # [Resultado]: Define se os artefatos ficam em disco local ou na nuvem (S3-compatível)
  storage:
    type: "filesystem"  # Opções: filesystem | s3
    truststore-archive-path: "ACcompactado.zip"
    hash-file-path: "hash.txt"
    confirmation-file-path: "ultima_confirmacao.txt"

  # Configurações para armazenamento no Filesystem Local
  # [Resultado]: Local onde os artefatos são mantidos em disco
  filesystem:
    base-dir: "${STORAGE_FILESYSTEM_DIR:.data/truststore-icpbrasil}"

  # Configurações para S3-compatible Storage (AWS S3, MinIO, etc.)
  # [Resultado]: Conexão com serviço de objetos S3
  s3:
    endpoint: "${S3_ENDPOINT:https://s3.amazonaws.com}"
    region: "${S3_REGION:us-east-1}"
    access-key: "${S3_ACCESS_KEY:}"
    secret-key: "${S3_SECRET_KEY:}"
    bucket: "${S3_BUCKET:}"
    # PEM da CA que assinou o cert do servidor S3 (classpath: ou file:).
    # Quando não definido, usa o trustManager global.
    # Exemplo: S3_CA_CERT_PATH=file:/etc/ssl/certs/minha-ca.crt
    ca-cert-path: "${S3_CA_CERT_PATH:}"

  # Diretório de Certificados Confiáveis Fixos
  # [Resultado]: Local onde o sistema busca certificados adicionais (JSON) no classpath ou disco
  trusted-certs:
    dir: "${TRUSTED_CERTS_DIR:classpath:registries/certificates}"
spring:
  application:
    name: trust-store

truststore:
  certificate-url: "https://acraiz.icpbrasil.gov.br/credenciadas/CertificadosAC-ICP-Brasil/ACcompactado.zip"
  hash-url: "https://acraiz.icpbrasil.gov.br/credenciadas/CertificadosAC-ICP-Brasil/hashsha512.txt"
  network:
    download-timeout-seconds: 30
    max-retries: 3
    retry-interval-seconds: 30
  cache-ttl-critical-hours: 72
  cache-ttl-max-hours: 168
  refresh-interval-hours: 2
  storage:
    type: filesystem
    filesystem-base-dir: "target/test-truststore"
    container-name: "staging"
    truststore-archive-path: "ACcompactado.zip"
    hash-file-path: "hash.txt"
    confirmation-file-path: "ultima_confirmacao.txt"

  minio:
    endpoint: "${MINIO_ENDPOINT:minio.clusterb.saude-go.net}"
    access-key: "${MINIO_ACCESS_KEY}"
    secret-key: "${MINIO_SECRET_KEY}"

  trusted-certs:
    dir: "classpath:registries/certificates"
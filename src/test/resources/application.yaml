spring:
  application:
    name: trust-store

  config.import: vault://

  cloud:
    vault:
      scheme: https
      token: "${VAULT_TOKEN}"
      host: "${VAULT_HOST:hl7-fhir.saude-go.net}"
      port: "${VAULT_PORT:8200}"
      authentication: token
      connection-timeout: 5000
      read-timeout: 15000

      kv:
        enabled: true

truststore:
  certificate-url: "https://acraiz.icpbrasil.gov.br/credenciadas/CertificadosAC-ICP-Brasil/ACcompactado.zip"
  hash-url: "https://acraiz.icpbrasil.gov.br/credenciadas/CertificadosAC-ICP-Brasil/hashsha512.txt"
  network:
    download-timeout-seconds: 30
    max-retries: 3
    retry-interval-seconds: 30
  cache-ttl-critical-hours: 72
  cache-ttl-max-hours: 168
  refresh-interval-hours: 2
  storage:
    container-name: "staging"
    truststore-archive-path: "truststore/ACcompactado.zip"
    hash-file-path: "truststore/hash.txt"
    confirmation-file-path: "truststore/ultima_confirmacao.txt"

  minio:
    endpoint: "${MINIO_ENDPOINT:minio.clusterb.saude-go.net}"
    access-key: "${MINIO_ACCESS_KEY}"
    secret-key: "${MINIO_SECRET_KEY}"

  vault:
    certificate-path: 'certificates'  # Path dos certificados confiáveis no Vault